<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            animation: floatAmbient 12s infinite ease-in-out;
            pointer-events: none;
        }

        body::after {
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(0,0,0,0) 70%);
            animation-delay: -6s;
            animation-duration: 16s;
        }

        @keyframes floatAmbient {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 40px) scale(1.2); }
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            z-index: 1;
        }

        .auth-card {
            background: rgba(25, 27, 35, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #181a23;
            border: 1px solid #2d3142;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .auth-footer a {
            color: #6366f1;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<canvas id="particle-canvas"></canvas>

<div class="auth-container">
    <div class="auth-card">

        <h2>Welcome back</h2>
        <p class="subtitle">Enter your details to access your account.</p>

        <form id="login-form">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn">
                Sign In
            </button>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </div>

    </div>
</div>

<script>

const form = document.getElementById('login-form');

form.addEventListener('submit', async (e) => {

    e.preventDefault();

    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();

    try {

        const response = await fetch(
            'https://nsdc-sem4-projects-t1fc-8xpcy9i8x-vyshakh-s-projects.vercel.app/api/v1/users/login',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        if(response.ok){

            alert("Login Successful!");

            window.location.href = "success.html";

        } else {

            alert(data.message || "Login Failed");

        }

    } catch(error){

        alert("Server Error");

        console.log(error);

    }

});


// PARTICLE BACKGROUND

const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x > canvas.width || this.x < 0) {
            this.speedX *= -1;
        }

        if (this.y > canvas.height || this.y < 0) {
            this.speedY *= -1;
        }
    }

    draw() {
        ctx.fillStyle = 'rgba(99,102,241,0.7)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initParticles() {

    particlesArray = [];

    for(let i = 0; i < 100; i++) {
        particlesArray.push(new Particle());
    }
}

function animateParticles() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particlesArray.forEach(particle => {
        particle.update();
        particle.draw();
    });

    requestAnimationFrame(animateParticles);
}

initParticles();
animateParticles();

window.addEventListener('resize', () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    initParticles();
});

</script>

</body>
</html>
