<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Welcome</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:350px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            color:#1e3c72;
            margin-bottom:15px;
        }

        p{
            color:#555;
            margin-bottom:30px;
        }

        .btn{
            display:block;
            width:100%;
            padding:12px;
            margin:10px 0;
            text-decoration:none;
            color:white;
            border-radius:10px;
            font-size:16px;
            transition:0.3s;
        }

        .login{
            background:#1e88e5;
        }

        .signup{
            background:#43a047;
        }

        .btn:hover{
            transform:scale(1.05);
            opacity:0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p>Login or create a new account</p>

        <a href="login.html" class="btn login">Login</a>
        <a href="signup.html" class="btn signup">Sign Up</a>
    </div>

</body>
</html>
